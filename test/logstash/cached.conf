# Same lookups with the 0.6.0 cache options enabled.
input { stdin { codec => json } }
filter {
  redis {
    host => "127.0.0.1"
    port => "${REDIS_PORT}"
    field => "[source][ip]"
    destination => "[threat][source]"
    fallback => "none"
    cache_ttl => 300
    cache_miss_ttl => 60
    cache_size => 1000
  }
  redis {
    host => "127.0.0.1"
    port => "${REDIS_PORT}"
    db => 1
    field => "[user_agent][original]"
    destination => "[threat][user_agent]"
    pattern_matching => true
    cache_ttl => 300
  }
}
output { stdout { codec => json_lines } }
