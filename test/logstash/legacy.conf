# 0.5.x-style configuration: no option introduced in 0.6.0.
input { stdin { codec => json } }
filter {
  redis {
    host => "127.0.0.1"
    port => "${REDIS_PORT}"
    field => "[source][ip]"
    destination => "[threat][source]"
    fallback => "none"
  }
  redis {
    host => "127.0.0.1"
    port => "${REDIS_PORT}"
    db => 1
    field => "[user_agent][original]"
    destination => "[threat][user_agent]"
    pattern_matching => true
  }
}
output { stdout { codec => json_lines } }
